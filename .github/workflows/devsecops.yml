name: DevSecOps Pipeline (Preentrega)

on:
  pull_request:
    branches: [ master]
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (SARIF)
        run: semgrep scan --config p/default --sarif-output=semgrep.sarif
        
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Guardar SARIF como artefacto
        uses: actions/upload-artifact@v4
        with:
            name: semgrep-sarif
            path: semgrep.sarif
        if: always()
      - name: Gate SAST (bloquea si hay hallazgos ERROR)
        run: semgrep scan --config p/default --severity ERROR --error

  sca:
      name: SCA - SBOM & Vulnerabilidades
      runs-on: ubuntu-latest
      permissions:
        contents: read
        security-events: write
      steps:
        - uses: actions/checkout@v4
        
        
        - name: Generate SBOM (CycloneDX) with Syft
          uses: anchore/sbom-action@v0
          with:
            path: .
            format: cyclonedx-json
            output-file: security/sbom/sbom.cdx.json
            
        - name: Scan with Grype
          uses: anchore/scan-action@v7.4.2
          with:
            path: "."                 
            fail-build: true
            severity-cutoff: high
          env:
            GRYPE_DB_AUTO_UPDATE: "true"  
            

        - name: Upload SBOM as artifact
          uses: actions/upload-artifact@v4
          with:
            name: sbom-cyclonedx
            path: security/sbom/sbom.cdx.json
  build:
    name: Build - Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t juice-shop:latest .

  dast:
    name: DAST - ZAP Baseline
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for Juice Shop
        run: |
          sleep 20
          curl -s http://localhost:3000 > /dev/null || (echo "App no responde" && exit 1)

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          allow_issue_writing: false      
          artifact_name: 'zap-report'      
  iac:
    name: IaC - Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Checkov on Dockerfile and Compose
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: dockerfile, yaml 
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
          
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif      